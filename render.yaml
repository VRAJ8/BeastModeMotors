# One-click demo deploy on Render: https://render.com/deploy
# Runs as a self-contained demo (SQLite, re-seeded on every fresh boot and rebuilt nightly). The image runs a
# queue worker and the scheduler next to the web server, so emails, reminders and expiry all work.
# For a real site, don't convert this demo: use render.production.yaml and follow docs/LAUNCH.md.
services:
  - type: web
    name: beast-mode-motors
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Beast Mode Motors
      - key: APP_KEY
        sync: false # paste the output of: php artisan key:generate --show
      - key: PORT
        value: "8080"
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_NIGHTLY_RESET
        value: "true"
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: MAIL_MAILER
        value: log
      - key: APP_TIMEZONE
        value: America/New_York

# APP_URL defaults to this service's onrender.com address, which the app always accepts.
