# One-click demo deploy on Render: https://render.com/deploy
# Runs as a self-contained demo (SQLite, re-seeded on every fresh boot).
# For a persistent production setup, add a Postgres database and set DB_* vars.
services:
  - type: web
    name: beast-mode-motors
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Beast Mode Motors
      - key: APP_KEY
        sync: false # paste the output of: php artisan key:generate --show
      - key: APP_URL
        sync: false # e.g. https://beast-mode-motors.onrender.com
      - key: PORT
        value: "8080"
      - key: DEMO_MODE
        value: "true"
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: log
      - key: APP_TIMEZONE
        value: America/New_York

# ---------------------------------------------------------------------------
# Going to production? Uncomment the database below and, on the web service,
# set DB_CONNECTION to pgsql and add:
#       - key: DB_URL
#         fromDatabase:
#           name: beast-mode-motors-db
#           property: connectionString
# then set DEMO_MODE=false, DOCUMENTS_DISK=s3, PHOTOS_DISK=s3-public, the AWS_*
# storage keys and an SMTP mailer (see .env.example). Run the scheduler
# (reminders, recall checks) with a Render Cron Job: `php artisan schedule:run`
# every minute, using this same image.
# ---------------------------------------------------------------------------
# databases:
#   - name: beast-mode-motors-db
#     plan: free
#     databaseName: beast_mode_motors
